{% extends 'base.html' %}
{% block body_class %}auth-theme{% endblock %}
{% block main_class %}auth-main{% endblock %}
{% block content %}
<section class="auth-shell">
  <span class="auth-blob blob-top" aria-hidden="true"></span>
  <span class="auth-blob blob-bottom" aria-hidden="true"></span>

  <div class="auth-card centered-page">
    <p class="auth-eyebrow">WJR Tecnosoluciones</p>
    <h2>Crea tu cuenta</h2>
    <form method="post" class="form auth-form">
      <label>Nombre <input type="text" name="nombre" placeholder="Tu nombre" required></label>
      <label>Email <input type="email" name="email" placeholder="ej. tuemail@dominio.com" required></label>
      <label>Contraseña <input type="password" name="password" placeholder="Mínimo 8 caracteres" required></label>
      <button type="submit">Crear cuenta</button>
    </form>
    <p class="auth-links"><a href="{{ url_for('login') }}">¿Ya tienes cuenta? Inicia sesión</a></p>
  </div>
</section>
{% endblock %}
